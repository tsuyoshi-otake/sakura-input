# Scoped mutants for the space-key-dispatch oracle campaign.
# This campaign mutates only the independent oracle when passed the explicit
# --file scope. Its denominator is not a production dispatch mutation score.

examine_re = [
  "space_effect",
  "peer_converting",
  "apply_space",
  "no_dual_effect",
  "apply",
]

exclude_re = [
  "prediction",
  "ai_text",
]

additional_cargo_test_args = [
  "--lib",
  "space_key_dispatch_oracle",
]

test_tool = "cargo"
