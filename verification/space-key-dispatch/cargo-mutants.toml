# Scoped mutants for the space-key-dispatch oracle campaign.
# Run from the repository root with --manifest-path crates/sakura-oracles/Cargo.toml
# and --file crates/sakura-oracles/src/space_key_dispatch_oracle.rs.
# Its denominator is not a production dispatch mutation score.

examine_re = [
  "space_effect",
  "peer_converting",
  "apply_space",
  "no_dual_effect",
  "apply",
]

exclude_re = [
  "prediction",
  "ai_text",
]

additional_cargo_test_args = [
  "--lib",
  "space_key_dispatch_oracle",
]

test_tool = "cargo"
