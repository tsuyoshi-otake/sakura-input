# Workspace build settings. See DESIGN 3.2 for the target policy this encodes.

[build]
# The only architecture this project ships to. Naming it here means a bare
# `cargo build` on any machine produces the artifact we actually distribute,
# rather than whatever the host happens to be.
target = "x86_64-pc-windows-msvc"

# AVX + SSSE3 is the shipped compatibility floor, not a feature to branch on.
# The narrow ASCII pass-through scanner uses `pshufb` (SSSE3), so enabling only
# AVX would let a copied binary execute an unsupported instruction before its
# startup resolver could reject the CPU. Every supported Windows 11 x64 CPU has
# both features, while the installer checks both explicitly.
#
# What this does NOT enable is deliberate: AVX2 is reached through run-time
# dispatch. AVX-512F+BW+VL candidates are benchmark-only in this release;
# production retains AVX2 until direct results are backed by stable
# end-to-end and cross-host evidence. sakura-core resolves one concrete kernel
# set at startup, because raising the compile-time floor to AVX2 would exclude
# working machines to save a single already-resolved indirect call.
#
# The cost of this line is that a CPU without AVX faults on an instruction
# rather than reaching our own check, which is why the installer refuses to
# install without AVX (DESIGN 12.2) instead of leaving it to the engine.
#
# Set per-target rather than under [build]: build scripts and proc macros run
# on the host and have no business inheriting the shipped binary's ISA floor.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+avx,+ssse3"]
