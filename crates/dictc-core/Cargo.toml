[package]
name = "dictc-core"
description = "Dictionary compiler library: parses licensed TSV sources and writes Sakura's read-only mmap image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
conversion-test-support = ["sakura-core/conversion-test-support"]
research-top32 = ["sakura-core/research-top32"]

[dependencies]
sakura-rerank-proto.workspace = true
sakura-core.workspace = true
sakura-context-proto.workspace = true
sakura-proto.workspace = true
quick-xml.workspace = true
flate2.workspace = true
# `dictc` is an offline build tool.  The LLM-detail release gate needs a
# battle-tested strict JSON parser; runtime binaries never depend on this.
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

[lints]
workspace = true
