[package]
name = "sakura-ai-worker"
description = "Isolated OpenAI Responses worker for explicit Sakura Input text edits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sakura_ai_worker"
path = "src/main.rs"

[dependencies]
sakura-ai-proto.workspace = true
serde_json = "=1.0.140"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[lints]
workspace = true
