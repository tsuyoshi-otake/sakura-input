[package]
name = "sakura-renderer"
description = "Sakura Input renderer: mode indicator, candidate window, and engine watchdog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sakura_renderer"
path = "src/main.rs"

[dependencies]
sakura-ipc.workspace = true
sakura-proto.workspace = true
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    # The title bar, for the Pad: a caption painted in the palette rather
    # than in whatever the system last chose for an unknown program.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # The clipboard, for the Pad's share action. `Win32_System_Memory`
    # comes with it: clipboard text is handed over in a moveable block.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # Process enumeration, for tests/watchdog_recovery.rs: a leftover renderer
    # is another watchdog, and it holds no pipe, so nothing but the process
    # list can find it.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
]

[lints]
workspace = true
