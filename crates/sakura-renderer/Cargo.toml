[package]
name = "sakura-renderer"
description = "Sakura Input renderer: mode indicator, candidate window, and engine watchdog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sakura_renderer"
path = "src/main.rs"

[dependencies]
sakura-ipc.workspace = true
sakura-proto.workspace = true
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Process enumeration, for tests/watchdog_recovery.rs: a leftover renderer
    # is another watchdog, and it holds no pipe, so nothing but the process
    # list can find it.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
]

[lints]
workspace = true
