[package]
name = "sakura-neural-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# sakura-input #474 condition 11: the `context-probe` binary is a
# measurement-only tool that feeds non-zero context/reading tensors. It is
# never part of the default build or the installer payload.
context-probe = []

[[bin]]
name = "sakura_neural_worker"
path = "src/main.rs"

[[bin]]
name = "context_probe"
path = "src/bin/context_probe.rs"
required-features = ["context-probe"]

[dependencies]
sakura-rerank-proto.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[lints]
workspace = true
