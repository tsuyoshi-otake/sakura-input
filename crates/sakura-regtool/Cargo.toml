[package]
name = "sakura-regtool"
description = "TSF/COM registration helper used by the installer and the dev workflow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sakura_regtool"
path = "src/main.rs"

[dependencies]
sakura-ipc.workspace = true
sakura-proto.workspace = true
sakura-reg.workspace = true

# Registration lives in sakura-reg and the pipe in sakura-ipc. What is left
# for the tool itself is deciding whether it is running as the signed-in
# user, which is a session question.
[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
]

[lints]
workspace = true
