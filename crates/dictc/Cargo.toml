[package]
name = "dictc"
description = "Dictionary compiler: licensed TSV sources to Sakura's read-only mmap image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
conversion-test-support = ["sakura-core/conversion-test-support"]
research-top32 = ["sakura-core/research-top32"]

[[bin]]
name = "dictc"
path = "src/main.rs"

[[bin]]
name = "glossary-import"
path = "src/bin/glossary_import.rs"

[[bin]]
name = "mozc-trim"
path = "src/bin/mozc_trim.rs"

[[bin]]
name = "corpus-eval"
path = "src/bin/corpus_eval.rs"

[[bin]]
name = "category-split"
path = "src/bin/category_split.rs"

[[bin]]
name = "llm-detail-targets"
path = "src/bin/llm_detail_targets.rs"

[[bin]]
name = "llm-detail-drafts"
path = "src/bin/llm_detail_drafts.rs"

[[bin]]
name = "llm-detail-promote"
path = "src/bin/llm_detail_promote.rs"

[[bin]]
name = "context-dataset"
path = "src/bin/context_dataset.rs"

[dependencies]
sakura-core.workspace = true
sakura-neural-proto.workspace = true
sakura-proto.workspace = true
quick-xml.workspace = true
flate2.workspace = true
# `dictc` is an offline build tool.  The LLM-detail release gate needs a
# battle-tested strict JSON parser; runtime binaries never depend on this.
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

[lints]
workspace = true
