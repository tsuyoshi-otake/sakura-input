[package]
name = "dictc"
description = "Dictionary build command-line tools: thin binaries over dictc-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
conversion-test-support = ["dictc-core/conversion-test-support"]
research-top32 = ["dictc-core/research-top32"]

[[bin]]
name = "dictc"
path = "src/main.rs"

[[bin]]
name = "glossary-import"
path = "src/bin/glossary_import.rs"

[[bin]]
name = "mozc-trim"
path = "src/bin/mozc_trim.rs"

[[bin]]
name = "inflection-expand"
path = "src/bin/inflection_expand.rs"

[[bin]]
name = "corpus-eval"
path = "src/bin/corpus_eval.rs"

[[bin]]
name = "neural-eval"
path = "src/bin/neural_eval.rs"

[[bin]]
name = "category-split"
path = "src/bin/category_split.rs"

[[bin]]
name = "llm-detail-targets"
path = "src/bin/llm_detail_targets.rs"

[[bin]]
name = "llm-detail-drafts"
path = "src/bin/llm_detail_drafts.rs"

[[bin]]
name = "llm-detail-promote"
path = "src/bin/llm_detail_promote.rs"

[[bin]]
name = "context-dataset"
path = "src/bin/context_dataset.rs"

[[bin]]
name = "compound-homophone-scan"
path = "src/bin/compound_homophone_scan.rs"

[dependencies]
dictc-core = { path = "../dictc-core" }
sakura-core.workspace = true
sakura-proto.workspace = true
sakura-rerank-proto.workspace = true
# Offline JSON and hashing for the LLM-detail and evaluation binaries;
# runtime binaries never depend on these (ci/dep-policy.ps1).
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

[lints]
workspace = true
