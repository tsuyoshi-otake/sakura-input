[package]
name = "sakura-engine"
description = "Sakura Input conversion engine: named-pipe server, session table, conversion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
context-research = ["dep:sakura-context-research"]
dev-fixtures = ["dep:dictc"]

[[bin]]
name = "sakura_engine"
path = "src/main.rs"

[[test]]
name = "appcontainer"
path = "tests/appcontainer.rs"
required-features = ["dev-fixtures"]

[[test]]
name = "cross_commit_learning"
path = "tests/cross_commit_learning.rs"
required-features = ["dev-fixtures"]

[[test]]
name = "high_load_key_integrity"
path = "tests/high_load_key_integrity.rs"
required-features = ["dev-fixtures"]

[[test]]
name = "ipc_latency"
path = "tests/ipc_latency.rs"
required-features = ["dev-fixtures"]

[[test]]
name = "pipe_round_trip"
path = "tests/pipe_round_trip.rs"
required-features = ["dev-fixtures"]

[[test]]
name = "shipped_dictionary_ranking"
path = "tests/shipped_dictionary_ranking.rs"
required-features = ["dev-fixtures"]

[[test]]
name = "space_key_dispatch_pipe"
path = "tests/space_key_dispatch_pipe.rs"
required-features = ["dev-fixtures"]

[[test]]
name = "zero_alloc_dispatch"
path = "tests/zero_alloc_dispatch.rs"
required-features = ["dev-fixtures"]

[dependencies]
dictc = { path = "../dictc", optional = true }
sakura-rerank-proto.workspace = true
sakura-core.workspace = true
sakura-context-research = { workspace = true, optional = true }
sakura-ai-proto.workspace = true
sakura-ipc.workspace = true
sakura-context-proto.workspace = true
sakura-proto.workspace = true
sakura-user-prefs.workspace = true
sakura-store.workspace = true
sakura-values.workspace = true

# The engine itself touches almost no Win32: the pipe — creation, security,
# framing — lives in sakura-ipc. What is left is reading an error code and
# attaching a console under --verbose.
[dependencies.windows]
workspace = true
# Win32_Security, Win32_Security_Isolation, and Win32_System_Threading are
# used only by tests/appcontainer.rs, which builds a real AppContainer token
# via CreateProcessW's PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES to prove
# DESIGN 7's sandboxed-access claim against a token Windows actually built.
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[dev-dependencies]
sakura-oracles.workspace = true
# Existing learning transaction fault tests execute through sakura-store after
# extraction. Cargo unifies this only for engine test builds; the store default
# feature set keeps the hooks out of shipping binaries.
sakura-store = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
