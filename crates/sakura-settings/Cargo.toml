[package]
name = "sakura-settings"
description = "Settings, user-dictionary, learning, diagnostics, and update control panel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sakura_settings"
path = "src/bootstrap.rs"

[[bin]]
name = "sakura_settings_payload"
path = "src/main.rs"

[dependencies]
sakura-ai-proto.workspace = true
sakura-core.workspace = true
sakura-engine.workspace = true
sakura-ipc.workspace = true
sakura-proto.workspace = true
sakura-reg.workspace = true
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
