[package]
name = "sakura-candidate-snapshot"
description = "Independent whole-reading candidate snapshot evaluator for Sakura Input"
version = "1.0.24"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace]
resolver = "2"
members = ["."]

[features]
default = []
# Current core exposes origin/path evidence and the InputSupport repair gate.
# v1.0.5 builds this same tool without the feature and report those fields as
# unsupported/null.
modern = []

[dependencies]
sakura-core = { path = "../../crates/sakura-core" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
