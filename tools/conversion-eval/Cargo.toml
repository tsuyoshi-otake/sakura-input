[package]
name = "sakura-conversion-eval"
description = "Offline conversion evaluators: corpus accuracy, reranker offline eval, and compound homophone survey."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# `learning-replay` drives the engine's replay API (#305). It is opt-in, so a
# workspace build never compiles the shipping engine with `replay-eval`.
learning-replay = ["dep:sakura-engine", "sakura-engine/replay-eval"]
# `accuracy-gate` (#333) measures the shipping conversion service and
# prediction runtime. It is opt-in for the same reason: a workspace build does
# not link the engine into an offline tool.
accuracy-gate = ["dep:sakura-engine", "dep:sha2"]

[[bin]]
name = "corpus-eval"
path = "src/bin/corpus_eval.rs"

[[bin]]
name = "neural-eval"
path = "src/bin/neural_eval.rs"

[[bin]]
name = "compound-homophone-scan"
path = "src/bin/compound_homophone_scan.rs"

[[bin]]
name = "learning-replay"
path = "src/bin/learning_replay.rs"
required-features = ["learning-replay"]

[[bin]]
name = "accuracy-gate"
path = "src/bin/accuracy_gate.rs"
required-features = ["accuracy-gate"]

[dependencies]
sakura-core = { path = "../../crates/sakura-core" }
sakura-engine = { path = "../../crates/sakura-engine", optional = true }
sakura-proto = { path = "../../crates/sakura-proto" }
sakura-rerank-proto = { path = "../../crates/sakura-rerank-proto" }
# neural-eval report serialization; offline only (ci/dep-policy.ps1).
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
# accuracy-gate report header: dictionary and corpus SHA-256 (ci/dep-policy.ps1).
sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
# learning-replay and accuracy-gate tests compile a fixture dictionary.
dictc-core = { path = "../../crates/dictc-core" }

[lints]
workspace = true
