[package]
name = "sakura-ime-eval"
description = "Offline Sakura Input quality-measurement runner: deterministic oracles, blind Luna Max judging, and release gates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ime-eval"
path = "src/main.rs"

[dependencies]
sakura-core = { path = "../../crates/sakura-core" }
sakura-ipc = { path = "../../crates/sakura-ipc" }
sakura-proto = { path = "../../crates/sakura-proto" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[lints]
workspace = true
