name: Installer

# Kept separate from ci.yml on purpose: this job needs Inno Setup, which the
# fast build/test/clippy loop in ci.yml does not, and a missing Inno Setup
# install should fail this workflow loudly rather than turning every commit's
# core CI signal red for a packaging-tool problem.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_LOCKED: "true"

jobs:
  build-installer:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # .cargo/config.toml pins [build] target = "x86_64-pc-windows-msvc"
      # (DESIGN 3.2: this product is x86_64-only), so a bare release build
      # already produces exactly the one artifact set installer/setup.iss
      # packages -- there is no separate i686-pc-windows-msvc step to run,
      # unlike a product that ships a 32-bit DLL for WOW64 hosts.
      - name: Build release
        run: cargo build --workspace --release

      # windows-latest's Inno Setup version and install path have moved
      # before across GitHub-hosted runner image updates; checking for the
      # exact path this step depends on and failing with a clear message
      # here is cheaper than debugging an opaque "ISCC.exe not found" a
      # dozen steps into ISCC's own output.
      - name: Verify Inno Setup is present
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Error "Inno Setup 6 not found at $iscc -- the windows-latest runner image no longer ships it at this path, or a required version bump changed it. Update this workflow's ISCC path to match."
            exit 1
          }
          Write-Host "found $iscc"

      # No signing here: an unsigned installer is fine for a CI artifact
      # that exists to prove the packaging step still works end to end.
      # SignTool integration (DESIGN 12.4: "every CI build emits a signed
      # installer") is release-time work, gated on having a certificate to
      # sign with, and belongs in a release workflow rather than here.
      - name: Compile installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\setup.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v4
        with:
          name: sakura_setup
          path: installer/out/sakura_setup.exe
          if-no-files-found: error
