name: Installer

# Kept separate from ci.yml on purpose: this job needs Inno Setup, which the
# fast build/test/clippy loop in ci.yml does not, and a missing Inno Setup
# install should fail this workflow loudly rather than turning every commit's
# core CI signal red for a packaging-tool problem.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_LOCKED: "true"

jobs:
  build-installer:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned Mozc dictionary data
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          ref: 3f235b4eb6fcff7d14ef5f0fb8ee56de7ee4c732
          path: .sources/mozc
          sparse-checkout: |
            LICENSE
            src/data/dictionary_oss

      - name: Check out pinned IT glossary data
        uses: actions/checkout@v4
        with:
          repository: systemexe-research-and-development/smile-chat
          ref: b5cada441b41c207ab49bf2cd5f1d9c5614c5b92
          path: .sources/smile-chat
          sparse-checkout: |
            frontend/public

      - uses: Swatinem/rust-cache@v2

      - name: Build and reproduce the release dictionary
        shell: pwsh
        run: >-
          ./scripts/build-dictionary.ps1
          -MozcSource .sources/mozc
          -GlossarySource .sources/smile-chat
          -OutputDirectory artifacts/release

      # .cargo/config.toml pins [build] target = "x86_64-pc-windows-msvc"
      # (DESIGN 3.2: this product is x86_64-only), so a bare release build
      # already produces exactly the one artifact set installer/setup.iss
      # packages -- there is no separate i686-pc-windows-msvc step to run,
      # unlike a product that ships a 32-bit DLL for WOW64 hosts.
      - name: Build release
        run: cargo build --workspace --release

      # No signing here: an unsigned installer is fine for a CI artifact
      # that exists to prove the packaging step still works end to end.
      # SignTool integration (DESIGN 12.4: "every CI build emits a signed
      # installer") is release-time work, gated on having a certificate to
      # sign with, and belongs in a release workflow rather than here.
      - name: Compile installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: sakura_setup
          path: |
            installer/out/sakura_setup.exe
            installer/out/installer-build.report.json
          if-no-files-found: error
