name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A dependency that resolves differently in CI than on a developer's machine
  # is a supply-chain surprise, so the lockfile is authoritative here.
  CARGO_NET_LOCKED: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and the single x86-64 target, so
      # rustup provisions exactly what the workspace declares. The CPU line
      # matters as much as the toolchain line: the SIMD tests only exercise
      # the kernels this runner's CPU actually supports, so a run that says
      # "agreement holds" is only as broad as the ISA printed here.
      - name: Show toolchain and CPU
        shell: pwsh
        run: |
          rustup show
          cargo --version
          (Get-CimInstance Win32_Processor).Name

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # DESIGN 7's sandboxed-access claim (the pipe's DACL and low-integrity
      # label must let a real AppContainer token connect and round-trip a
      # keystroke) is not exercised by the default `cargo test --workspace`
      # run above: it is `#[ignore]`d there because it creates an
      # AppContainer profile and spawns a sandboxed child against the
      # engine's per-logon-session singleton pipe, which would race
      # `pipe_round_trip.rs` and `ipc_latency.rs` if `cargo test` ran it
      # concurrently with them. Run alone, after `Test`, never overlapping
      # it. The `--exact` name filter is required, not stylistic: the same
      # binary also holds the sandboxed-side probe test, which is meant only
      # to be re-executed inside the AppContainer this step's test builds,
      # and plain `--ignored` with no filter would run that copy directly
      # too (see appcontainer.rs's module docs).
      - name: Sandbox access (AppContainer)
        run: cargo test -p sakura-engine --test appcontainer -- --exact the_pipe_is_reachable_from_a_real_appcontainer_token --ignored --nocapture

      # The release profile is where panic=abort and fat LTO apply, and both
      # have broken builds that were green in debug. It is a gate, not a bonus.
      - name: Build release
        run: cargo build --workspace --release

  dependency-policy:
    name: Dependency policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the gate can still fail before trusting it to pass.
      - name: Self-test the gate
        shell: pwsh
        run: ./ci/dep-policy.ps1 -SelfTest

      - name: Enforce the full-scratch rule
        shell: pwsh
        run: ./ci/dep-policy.ps1

  # Fuzzing is sharded so a long campaign is wall-clock bounded, and each shard
  # is seeded from its index so a failure names a reproducible seed rather than
  # "it happened once". Kept off pull requests: it is a soak, not a gate.
  fuzz:
    name: Fuzz (shard ${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SAKURA_FUZZ_ITERS: "2000000"
      SAKURA_FUZZ_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz the protocol decoders
        run: cargo test -p sakura-proto --release -- --ignored --nocapture
