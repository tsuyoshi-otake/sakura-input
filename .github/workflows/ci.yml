name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A dependency that resolves differently in CI than on a developer's machine
  # is a supply-chain surprise, so the lockfile is authoritative here.
  CARGO_NET_LOCKED: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and the single x86-64 target, so
      # rustup provisions exactly what the workspace declares. The CPU line
      # matters as much as the toolchain line, and it is not a constant:
      # `windows-latest` handed this repository an EPYC 7763 (Zen 3, no
      # AVX-512) and an EPYC 9V74 (Zen 4, which has it) 37 minutes apart. The
      # SIMD tests only exercise the kernels the host supports, so which CPU
      # answered decides how broad "agreement holds" actually was.
      - name: Show toolchain and CPU
        shell: pwsh
        run: |
          rustup show
          cargo --version
          (Get-CimInstance Win32_Processor).Name

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Prove workspace test runners exited
        if: always()
        shell: pwsh
        run: |
          ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Terminate
            throw 'a test process survived its invocation'
          }

      # `cargo test` captures stdout, so the step above proves the kernels
      # agree without ever saying *which* kernels — and since the runner CPU
      # varies (see "Show toolchain and CPU"), that set is not the same from
      # run to run. Coverage you cannot tell apart from its absence is not
      # coverage. This costs a few milliseconds and makes the log name the
      # ISA the run actually exercised, so a reader can check rather than
      # assume. It does not *require* any particular kernel: AVX-512 is
      # verified locally by decision, and this step only reports.
      #
      # Quoted, and it has to be: the filter `simd::` puts a colon directly
      # before a space, which is YAML's mapping separator, so unquoted this
      # one line makes the whole file unparseable. GitHub does not report
      # that as a syntax error on line 56 — it reports the workflow as
      # having no triggers at all, names the run after the file path instead
      # of `CI`, and runs zero jobs.
      - name: Name the SIMD kernels this runner exercised
        run: "cargo test -p sakura-core --lib -- simd:: --nocapture"

      - name: Prove SIMD test runner exited
        if: always()
        shell: pwsh
        run: |
          ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Terminate
            throw 'a test process survived its invocation'
          }

      # DESIGN 7's sandboxed-access claim (the pipe's DACL and low-integrity
      # label must let a real AppContainer token connect and round-trip a
      # keystroke) is not exercised by the default `cargo test --workspace`
      # run above: it is `#[ignore]`d there because it creates an
      # AppContainer profile and spawns a sandboxed child against the
      # engine's per-logon-session singleton pipe, which would race
      # `pipe_round_trip.rs` and `ipc_latency.rs` if `cargo test` ran it
      # concurrently with them. Run alone, after `Test`, never overlapping
      # it. The `--exact` name filter is required, not stylistic: the same
      # binary also holds the sandboxed-side probe test, which is meant only
      # to be re-executed inside the AppContainer this step's test builds,
      # and plain `--ignored` with no filter would run that copy directly
      # too (see appcontainer.rs's module docs).
      - name: Sandbox access (AppContainer)
        run: cargo test -p sakura-engine --test appcontainer -- --exact the_pipe_is_reachable_from_a_real_appcontainer_token --ignored --nocapture

      - name: Prove AppContainer test runner exited
        if: always()
        shell: pwsh
        run: |
          ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Terminate
            throw 'a test process survived its invocation'
          }

      # The release profile is where panic=abort and fat LTO apply, and both
      # have broken builds that were green in debug. It is a gate, not a bonus.
      - name: Build release
        run: cargo build --workspace --release

  dependency-policy:
    name: Dependency policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the gate can still fail before trusting it to pass.
      - name: Self-test the gate
        shell: pwsh
        run: ./ci/dep-policy.ps1 -SelfTest

      - name: Enforce the full-scratch rule
        shell: pwsh
        run: ./ci/dep-policy.ps1

  # These are bounded smoke slices for all three Phase 5 fuzz surfaces. The
  # resumable, evidence-producing 72-hour run lives in fuzz-campaign.yml; this
  # job keeps its exact ignored entry points from silently becoming no-ops.
  fuzz:
    name: Fuzz (shard ${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SAKURA_FUZZ_ITERS: "2000000"
      SAKURA_FUZZ_SHARD: ${{ matrix.shard }}
      SAKURA_FUZZ_SEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz the protocol decoders
        run: cargo test -p sakura-proto --release --test robustness sharded_protocol_campaign -- --exact --ignored --nocapture
      - name: Prove protocol fuzz runner exited
        if: always()
        shell: pwsh
        run: |
          ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Terminate
            throw 'a test process survived its invocation'
          }
      - name: Fuzz hostile dictionary images
        run: cargo test -p dictc --release --test dictionary_robustness sharded_hostile_dictionary_campaign -- --exact --ignored --nocapture
      - name: Prove dictionary fuzz runner exited
        if: always()
        shell: pwsh
        run: |
          ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Terminate
            throw 'a test process survived its invocation'
          }
      - name: Fuzz the input FSM
        run: cargo test -p sakura-core --release --test fsm_robustness sharded_fsm_campaign -- --exact --ignored --nocapture
      - name: Prove FSM fuzz runner exited
        if: always()
        shell: pwsh
        run: |
          ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            ./ci/check-process-clean.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Terminate
            throw 'a test process survived its invocation'
          }
