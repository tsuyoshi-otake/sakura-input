schema_version = 1

[mozc]
repository = "https://github.com/google/mozc"
revision = "3f235b4eb6fcff7d14ef5f0fb8ee56de7ee4c732"
dictionary_glob = "src/data/dictionary_oss/dictionary??.txt"
connection = "src/data/dictionary_oss/connection_single_column.txt"
pos_ids = "src/data/dictionary_oss/id.def"
segmenter_rules = "src/data/rules/segmenter.def"
license_files = ["LICENSE", "src/data/dictionary_oss/README.txt"]
output_license = "LicenseRef-Mozc-Dictionary"

[mozc.trim]
max_word_cost = 6900
max_candidates_per_reading = 12

[smile_chat]
repository = "https://github.com/systemexe-research-and-development/smile-chat"
revision = "b5cada441b41c207ab49bf2cd5f1d9c5614c5b92"
glossary_glob = "frontend/public/glossaries/ja_part*.json"
license_file = "frontend/public/LICENSE"
output_license = "MIT"

[smile_chat.defaults]
katakana_left_id = 1851
katakana_right_id = 1851
ascii_left_id = 1851
ascii_right_id = 1851
base_word_cost = 4800

[japanese_wordnet]
release = "v1.1"
official_page = "https://bond-lab.github.io/wnja/jpn/downloads.html"
artifact_url = "https://github.com/bond-lab/wnja/releases/download/v1.1/jpn_wn_lmf.xml.gz"
artifact_file = "jpn_wn_lmf.xml.gz"
artifact_bytes = 12415268
artifact_sha256 = "1ed18d08f6f311ebd05c15344b2ebb4ece6752cccfcfe6f9ecffafd7aa207aa0"
license_url = "https://bond-lab.github.io/wnja/license.txt"
license_file = "THIRD_PARTY_LICENSES/japanese-wordnet-1.1-NICT.txt"
output_license = "LicenseRef-Japanese-WordNet-1.1"
format = "WordNet-LMF XML, gzip-compressed"
transform = "streaming Rust importer; exact unambiguous entry identity only"

[sakura_curated]
path = "data/curated-terms.tsv"
license_file = "LICENSE"
output_license = "MIT"
purpose = "Canonical casing and Shift+ASCII terms absent from the generated glossary"

[sakura_inflection]
generator = "crates/dictc/src/inflection.rs"
pos_ids = "src/data/dictionary_oss/id.def"
output_license = "LicenseRef-Mozc-Dictionary"
purpose = "Fused conjugations (て/た/ない/ます/…) missing from the Mozc cost trim"
