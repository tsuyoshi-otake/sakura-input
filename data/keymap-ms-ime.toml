# The `ms-ime` key map preset — the default (DESIGN 2 "Key map").
#
# Windows 11 Microsoft IME conventions, because that is what a Windows user's
# fingers already know. A user's own file is layered on top of this one as
# per-key overrides; it never has to restate a binding it is happy with, and
# the action `unbound` frees a key entirely.
#
# Sections are the state the composition is in. `[global]` applies in every
# state, and a state's own binding wins over it.
#
# A spec is `modifier+modifier+key`, with modifiers `shift`, `ctrl`, `alt`.
# Modifiers match exactly — `shift+enter` is a separate binding from `enter`,
# not a variation on it. Caps Lock and Kana Lock never take part.
#
# Ctrl+Space is deliberately absent: it is IntelliSense in every major IDE,
# which is the target user's home turf (DESIGN 2). It stays available as an
# opt-in binding.

[global]
# JIS keyboards have the key; US keyboards get Alt+` so they lose nothing.
hankaku_zenkaku = "ime_toggle"
"alt+`" = "ime_toggle"
kana_mode = "mode_kana_toggle"

[idle]
# 無変換 and 変換 with no composition. Windows 11 lets both be reassigned to
# IME off/on; a user who wants that writes two lines in their own file.
muhenkan = "mode_kana_toggle"
henkan = "reconvert"
# 確定の取り消し. Outside the armed window the engine passes this through to
# the application as delete-previous-word (DESIGN 2).
"ctrl+backspace" = "undo_commit"

[composing]
space = "convert"
henkan = "convert"
enter = "commit"
# Commits the top prediction without focusing the list first.
"shift+enter" = "commit_first"
escape = "cancel"
# Tab is the suggest-accept key (DESIGN 2). Per-app profiles disable suggest
# in terminals so Tab keeps meaning shell completion.
tab = "predict_next"
"shift+tab" = "predict_prev"
down = "predict_next"
up = "predict_prev"
backspace = "delete_back"
delete = "delete_forward"
left = "caret_left"
right = "caret_right"
home = "caret_home"
end = "caret_end"
muhenkan = "mode_kana_toggle"
f6 = "transform_hiragana"
f7 = "transform_katakana"
f8 = "transform_half_katakana"
f9 = "transform_full_alnum"
f10 = "transform_half_alnum"
"ctrl+u" = "transform_hiragana"
"ctrl+i" = "transform_katakana"
"ctrl+o" = "transform_half_katakana"
"ctrl+p" = "transform_full_alnum"
"ctrl+t" = "transform_half_alnum"

[converting]
space = "candidate_next"
henkan = "candidate_next"
"shift+space" = "candidate_prev"
down = "candidate_next"
up = "candidate_prev"
page_down = "candidate_page_down"
page_up = "candidate_page_up"
# Tab means the expanded candidate table here, not prediction: by this point
# the candidate window is what is on screen.
tab = "candidate_expand"
enter = "commit"
escape = "cancel"
# Backspace backs out of conversion rather than deleting a character —
# the preedit is still there to go back to.
backspace = "cancel"
left = "segment_prev"
right = "segment_next"
"shift+left" = "segment_shrink"
"shift+right" = "segment_grow"
f6 = "transform_hiragana"
f7 = "transform_katakana"
f8 = "transform_half_katakana"
f9 = "transform_full_alnum"
f10 = "transform_half_alnum"
"ctrl+u" = "transform_hiragana"
"ctrl+i" = "transform_katakana"
"ctrl+o" = "transform_half_katakana"
"ctrl+p" = "transform_full_alnum"
"ctrl+t" = "transform_half_alnum"

[predicting]
tab = "predict_next"
"shift+tab" = "predict_prev"
down = "predict_next"
up = "predict_prev"
enter = "commit"
# Escape returns to the plain preedit rather than discarding it.
escape = "cancel"
# Prediction never blocks conversion (DESIGN 2).
space = "convert"
henkan = "convert"
backspace = "delete_back"
