# The `ms-ime` key map preset — the default (DESIGN 2 "Key map").
#
# Windows 11 Microsoft IME conventions, because that is what a Windows user's
# fingers already know. A user's own file is layered on top of this one as
# per-key overrides; it never has to restate a binding it is happy with, and
# the action `unbound` frees a key entirely.
#
# Sections are the state the composition is in. `[global]` applies in every
# state, and a state's own binding wins over it.
#
# A spec is `modifier+modifier+key`, with modifiers `shift`, `ctrl`, `alt`.
# Modifiers match exactly — `shift+enter` is a separate binding from `enter`,
# not a variation on it. Keyboard lock bits never take part in modifier matching;
# the Caps Lock key itself can still be named as a trigger.
#
# Ctrl+Space is deliberately absent: it is IntelliSense in every major IDE,
# which is the target user's home turf (DESIGN 2). It stays available as an
# opt-in binding.

[global]
# JIS keyboards have the key; US keyboards get Alt+` so they lose nothing.
hankaku_zenkaku = "ime_toggle"
"alt+`" = "ime_toggle"
kana_mode = "mode_hiragana"
"shift+kana_mode" = "mode_katakana"
caps_lock = "mode_alnum_toggle"
"ctrl+caps_lock" = "mode_hiragana"
"shift+caps_lock" = "mode_katakana"
muhenkan = "mode_kana_cycle"
"shift+muhenkan" = "mode_alnum_width_toggle"

[idle]
# 無変換 and 変換 with no composition. Windows 11 lets both be reassigned to
# IME off/on; a user who wants that writes two lines in their own file.
henkan = "reconvert"
# 確定の取り消し. Outside the armed window the engine passes this through to
# the application as delete-previous-word (DESIGN 2).
"ctrl+backspace" = "undo_commit"

[composing]
space = "convert"
"shift+space" = "convert"
henkan = "convert"
enter = "commit"
# Commits the top prediction without focusing the list first.
"shift+enter" = "commit_first"
escape = "cancel"
# Tab is the suggest-accept key (DESIGN 2). Per-app profiles disable suggest
# in terminals so Tab keeps meaning shell completion.
tab = "predict_next"
"shift+tab" = "predict_prev"
down = "predict_next"
up = "predict_prev"
backspace = "delete_back"
delete = "delete_forward"
left = "caret_left"
right = "caret_right"
home = "caret_home"
end = "caret_end"
# There is no candidate window to page through yet -- claim the keys so they
# do not reach the host application mid-composition instead of leaving them
# unbound (issue #16 finding E).
page_down = "swallow"
page_up = "swallow"
f6 = "transform_hiragana"
f7 = "transform_katakana"
f8 = "transform_half_katakana"
f9 = "transform_full_alnum"
f10 = "transform_half_alnum"
"ctrl+u" = "transform_hiragana"
"ctrl+i" = "transform_katakana"
"ctrl+o" = "transform_half_katakana"
"ctrl+p" = "transform_full_alnum"
"ctrl+t" = "transform_half_alnum"

[converting]
# While a reading is being edited, the global 無変換 binding is a temporary
# kana-surface transform; it must not switch the persistent input mode.
muhenkan = "mode_kana_cycle"
space = "candidate_next"
henkan = "candidate_next"
"shift+space" = "candidate_prev"
down = "candidate_next"
up = "candidate_prev"
page_down = "candidate_page_down"
page_up = "candidate_page_up"
"1" = "candidate_1"
"2" = "candidate_2"
"3" = "candidate_3"
"4" = "candidate_4"
"5" = "candidate_5"
"6" = "candidate_6"
"7" = "candidate_7"
"8" = "candidate_8"
"9" = "candidate_9"
# Tab means the expanded candidate table here, not prediction: by this point
# the candidate window is what is on screen.
tab = "candidate_expand"
enter = "commit"
escape = "cancel"
# Backspace backs out of conversion rather than deleting a character —
# the preedit is still there to go back to.
backspace = "cancel"
left = "segment_prev"
right = "segment_next"
"shift+left" = "segment_shrink"
"shift+right" = "segment_grow"
# Home/End address the segment list rather than the raw preedit cursor,
# which conversion has already cut into segments (issue #16 finding E).
home = "segment_home"
end = "segment_end"
# None of the three has a modelled effect once the candidate window is
# open; claim them so they do not fall through to the host application
# (issue #16 finding E). `ctrl+delete` here is unrelated to [predicting]'s
# `delete_prediction_history` binding below -- that only ever targets a
# focused suggestion, never a conversion candidate.
delete = "swallow"
"shift+tab" = "swallow"
"ctrl+delete" = "swallow"
f6 = "transform_hiragana"
f7 = "transform_katakana"
f8 = "transform_half_katakana"
f9 = "transform_full_alnum"
f10 = "transform_half_alnum"
"ctrl+u" = "transform_hiragana"
"ctrl+i" = "transform_katakana"
"ctrl+o" = "transform_half_katakana"
"ctrl+p" = "transform_full_alnum"
"ctrl+t" = "transform_half_alnum"

[predicting]
# Microsoft IME commits a suggestion by its numbered slot once the list owns
# keyboard focus. This section is only reached after Tab or Down; while the
# list is merely visible the composing map applies, so a number typed during
# `２２` stays text instead of selecting the second suggestion.
"1" = "candidate_1"
"2" = "candidate_2"
"3" = "candidate_3"
"4" = "candidate_4"
"5" = "candidate_5"
"6" = "candidate_6"
"7" = "candidate_7"
"8" = "candidate_8"
"9" = "candidate_9"
# Only a focused learned-history suggestion may be removed. The engine beeps
# for system/user entries, unavailable selection, and durable write failure.
"ctrl+delete" = "delete_prediction_history"
tab = "predict_next"
"shift+tab" = "predict_prev"
down = "predict_next"
up = "predict_prev"
enter = "commit"
# Escape returns to the plain preedit rather than discarding it.
escape = "cancel"
# Prediction never blocks conversion (DESIGN 2).
space = "convert"
"shift+space" = "convert"
henkan = "convert"
backspace = "delete_back"
# Caret movement, forward delete, the commit-the-top-pick shortcut and the
# five surface transforms, the same as [composing]'s -- a focused
# suggestion must not block editing or re-transforming the segment
# underneath it (issue #16 finding E).
left = "caret_left"
right = "caret_right"
home = "caret_home"
end = "caret_end"
delete = "delete_forward"
"shift+enter" = "commit_first"
f6 = "transform_hiragana"
f7 = "transform_katakana"
f8 = "transform_half_katakana"
f9 = "transform_full_alnum"
f10 = "transform_half_alnum"
