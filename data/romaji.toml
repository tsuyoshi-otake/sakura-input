# --- Sokuon by doubled consonant ---
# The doubled consonant emits っ and hands the consonant back to the FSM, so
# `kekka` runs け → っ(carry k) → か.
#
# `nn` is absent on purpose: it is ん, and always has been. `ll` and `xx` are
# absent because `l` and `x` introduce small kana rather than a consonant.
kk = ["っ", "k"]
ss = ["っ", "s"]
tt = ["っ", "t"]
hh = ["っ", "h"]
ff = ["っ", "f"]
mm = ["っ", "m"]
yy = ["っ", "y"]
rr = ["っ", "r"]
ww = ["っ", "w"]
gg = ["っ", "g"]
zz = ["っ", "z"]
jj = ["っ", "j"]
dd = ["っ", "d"]
bb = ["っ", "b"]
pp = ["っ", "p"]
cc = ["っ", "c"]
vv = ["っ", "v"]

# --- Punctuation ---
# Kuten and touten are produced in their Japanese form here and re-styled at
# the width/punctuation choke point (DESIGN 5.6), so `punctuation_style` has a
# single place to act rather than a second table to keep in sync.
"-" = "ー"
"," = "、"
"." = "。"
"/" = "・"
"[" = "「"
"]" = "」"
