# Romaji → kana input table (DESIGN 5.1).
#
# Each entry maps a romaji sequence to the kana it produces. A plain string is
# the whole output; a two-element list is `[output, carry]`, where the carry is
# re-fed to the FSM as if the user had typed it — that is how `tt` becomes っ
# followed by a pending `t`.
#
# The FSM matches longest-first with backtracking, so an entry that is a prefix
# of a longer one waits: `n` alone is ん, but only once the next key rules out
# `na`, `ni`, `nn` and the rest.
#
# Lookup is case-insensitive for ASCII. Whether a capital letter reaches the
# FSM at all is a mode decision made a layer up, not a property of this table.
#
# The table is user-overridable, which is also how AZIK and other custom
# layouts are supported without any code (DESIGN 5.1).
#
# Deliberately absent, so that the shipped default matches Microsoft IME
# conventions (a user who wants them can add them to their own table):
#   - the `z`-prefix arrow shortcuts (`zh` → ←) from ATOK and Google IME
#   - the archaic kana `ゐ` / `ゑ`

[kana]

# --- Vowels ---
a = "あ"
i = "い"
u = "う"
e = "え"
o = "お"

