"n'" = "ん"
xn = "ん"
# Match Microsoft IME: `nn` resolves to ん immediately, including before a
# vowel. Thus `hannei` is はんえい, not はんねい. A following な-row or や-row
# syllable needs a third `n` (`minnna`, `konnnichiha`); an apostrophe is an
# alternate delimiter where it reads more clearly (`hon'ya`).

