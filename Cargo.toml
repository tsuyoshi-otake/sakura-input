[workspace]
resolver = "2"
members = [
    "crates/sakura-core",
    "crates/sakura-store",
    "crates/sakura-values",
    "crates/sakura-proto",
    "crates/sakura-context-proto",
    "crates/sakura-ipc",
    "crates/sakura-reg",
    "crates/sakura-tsf",
    "crates/sakura-engine",
    "crates/sakura-rerank-proto",
    "crates/sakura-oracles",
    "crates/sakura-context-research",
    "crates/sakura-renderer",
    "crates/sakura-regtool",
    "crates/sakura-logon",
    "crates/sakura-settings",
    "crates/dictc-core",
    "crates/dictc",
    "crates/sakura-neural-worker",
    "crates/sakura-ai-proto",
    "crates/sakura-ai-worker",
    "tools/candidate-sweep",
    "tools/conversion-eval",
    "tools/ime-eval",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/tsuyoshi-otake/sakura-input"
authors = ["Sakura Input contributors"]

# Dependency policy (DESIGN.md 3.1): core shipping binaries admit only the
# Windows binding family. The optional out-of-process neural worker has a
# separate closed allowlist for dynamic ORT bindings, strict manifest parsing,
# hashing, and tokenization. CI enforces both sets with ci/dep-policy.ps1.
[workspace.dependencies]
sakura-core = { path = "crates/sakura-core" }
sakura-store = { path = "crates/sakura-store" }
sakura-values = { path = "crates/sakura-values" }
sakura-proto = { path = "crates/sakura-proto" }
sakura-context-proto = { path = "crates/sakura-context-proto" }
sakura-ai-proto = { path = "crates/sakura-ai-proto" }
sakura-ipc = { path = "crates/sakura-ipc" }
sakura-reg = { path = "crates/sakura-reg" }
sakura-engine = { path = "crates/sakura-engine" }
sakura-context-research = { path = "crates/sakura-context-research" }
sakura-oracles = { path = "crates/sakura-oracles" }
sakura-rerank-proto = { path = "crates/sakura-rerank-proto" }
windows-core = "0.62"
windows = "0.62"
# Pinned, streaming-only parsers used exclusively by the offline `dictc` build
# tool to read the official compressed Japanese WordNet LMF source.
quick-xml = "=0.41.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
incremental = false

# The DLL loads into every host process and has a hard 1 MB budget
# (DESIGN.md 10), so it optimizes for size while the engine optimizes for speed.
[profile.release.package.sakura-tsf]
opt-level = "z"

[profile.dev]
panic = "unwind"
